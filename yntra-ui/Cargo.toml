[package]
name = "yntra-ui"
version.workspace = true
edition.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["web"] }
dioxus-logger = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
yntra-core = { workspace = true }
rkyv = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true }
getrandom = { workspace = true }
fluent-bundle = { workspace = true }
unic-langid = { workspace = true }
qrcodegen = { workspace = true }
dioxus-icons = "0.1.0"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955" }
palette = "0.7"
blake3 = { version = "1.5.1", features = ["zeroize"] }
const-hex = { version = "1.12", features = ["alloc"] }
chrono = { version = "0.4.38", features = ["clock", "now"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus = { workspace = true, features = ["desktop"] }
rfd = "0.17"

[dev-dependencies]
dioxus-ssr = "0.7"

