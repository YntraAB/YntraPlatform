[package]
name = "yntra-core"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
uniffi = { workspace = true }
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
getrandom = { workspace = true }
sha2 = "0.10"
pbkdf2 = "0.12"
argon2 = { version = "0.5.3", features = ["std"] }
chacha20poly1305 = "0.10.1"
blake3 = "1.5.1"
reqwest = { workspace = true }
totp-rs = { workspace = true }
loro = "1.13.6"
diff = "0.1.13"
chrono = { version = "0.4.38", features = ["clock", "wasmbind"] }
tracing = "0.1"
const-hex = { version = "1.12", features = ["alloc"] }
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libsql = { version = "0.6.0", features = ["replication"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync"] }
pcsc = "2.8"
tracing-subscriber = { version = "0.3.18", features = ["fmt", "env-filter"] }


[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Storage", "Window"] }
js-sys = { workspace = true }
wasm-bindgen-futures = { workspace = true }
tracing-wasm = "0.2.1"

