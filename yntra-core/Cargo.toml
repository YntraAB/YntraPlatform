[package]
name = "yntra-core"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
uniffi = { workspace = true }
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
getrandom = { workspace = true }
sha2 = "0.10"
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
chacha20poly1305 = "0.10.1"
blake3 = { version = "1.5.1", features = ["zeroize"] }
reqwest = { workspace = true }
totp-rs = { workspace = true, features = ["zeroize"] }
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["alloc", "zeroize"] }
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "zeroize"] }
ark-ff = { version = "0.4.0", default-features = false }
ark-ec = { version = "0.4.0", default-features = false }
ark-bn254 = { version = "0.4.0", default-features = false, features = ["curve", "scalar_field"] }
ark-std = { version = "0.4.0", default-features = false }
ark-groth16 = { version = "0.4.0", default-features = false }
ark-snark = { version = "0.4.0", default-features = false }
ark-relations = { version = "0.4.0", default-features = false }
ark-serialize = { version = "0.4.0", default-features = false, features = ["derive"] }
loro = "1.13.6"
diff = "0.1.13"
chrono = { version = "0.4.38", features = ["clock", "wasmbind"] }
tracing = "0.1"
const-hex = { version = "1.12", features = ["alloc"] }
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libsql = { version = "0.6.0", features = ["replication"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync"] }
pcsc = "2.8"
tracing-subscriber = { version = "0.3.18", features = ["fmt", "env-filter"] }
keyring = "4.1"
memmap2 = "0.9.5"



[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Storage", "Window"] }
js-sys = { workspace = true }
wasm-bindgen-futures = { workspace = true }
tracing-wasm = "0.2.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde-wasm-bindgen = "0.6"

[features]
test-utils = []


