name: SOTA CI Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  sota-ci:
    name: SOTA Verification Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain & WASM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: 1. Code Style & Formatter Verification
        run: cargo fmt --all -- --check

      - name: 2. Clippy Lints & Static Analysis
        run: cargo clippy --workspace -- -D warnings

      - name: 3. Cross-Platform Workspace Compilation Check
        run: cargo check --workspace

      - name: 4. WASM Target Sandbox Compatibility
        run: cargo check --target wasm32-unknown-unknown -p yntra-core

      - name: 5. UniFFI Swift/Kotlin Mobile Bindings Verification
        run: cargo run -p yntra-uniffi-bindgen

      - name: 6. Full Workspace Integration & Unit Tests
        run: cargo test --workspace --all-targets
